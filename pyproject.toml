[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-warmer"
version = "0.1.0"
description = "Launcher that wraps Claude Code with a local reverse proxy to keep its prompt cache warm."
requires-python = ">=3.11"
dependencies = ["mitmproxy", "click"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ty"]

[project.scripts]
claude-warmer = "claude_warmer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
