[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-thermos"
version = "0.3.0"
description = "Keeps your Claude session warm for you."
authors = [{ name = "Iaroslav Zeigerman", email = "zeigerman.ia@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mitmproxy", "click", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[project.scripts]
claude-thermos = "claude_thermos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F401",
    "F811",
    "RET505",
    "T100",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN205",
    "ANN206",
]
extend-select = ["TID"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
